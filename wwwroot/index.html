<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity App - Todo, Timer & Alarm</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/timer-alarm.css">
</head>
<body>
    <div class="container">
        <h1>⚡ Productivity App</h1>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('todo')">📝 Todo List</button>
            <button class="tab-btn" onclick="showTab('timer')">⏱️ Đếm Giờ</button>
            <button class="tab-btn" onclick="showTab('alarm')">⏰ Báo Thức</button>
        </div>

        <!-- Todo Tab -->
        <div id="todoTab" class="tab-content active">
            <div class="add-todo">
                <input type="text" id="todoInput" placeholder="Thêm công việc mới..." />
                <button onclick="addTodo()">Thêm</button>
            </div>

            <div class="stats">
                <span>Tổng: <span id="totalCount">0</span></span>
                <span>Hoàn thành: <span id="completedCount">0</span></span>
                <span>Chưa xong: <span id="pendingCount">0</span></span>
            </div>

            <ul id="todoList" class="todo-list"></ul>
        </div>

        <!-- Timer Tab -->
        <div id="timerTab" class="tab-content">
            <div class="timer-modes">
                <button class="mode-btn active" onclick="setTimerMode('stopwatch')">Bấm Giờ</button>
                <button class="mode-btn" onclick="setTimerMode('countdown')">Đếm Ngược</button>
                <button class="mode-btn" onclick="setTimerMode('pomodoro')">Pomodoro</button>
            </div>

            <div class="timer-display" id="timerDisplay">00:00:00</div>

            <div id="countdownInput" class="countdown-input" style="display:none;">
                <input type="number" id="countdownMinutes" placeholder="Phút" min="0" max="999" />
                <span>:</span>
                <input type="number" id="countdownSeconds" placeholder="Giây" min="0" max="59" />
            </div>

            <div class="timer-controls">
                <button class="timer-btn start" id="timerStartBtn" onclick="startTimer()">▶️ Bắt Đầu</button>
                <button class="timer-btn pause" id="timerPauseBtn" onclick="pauseTimer()" style="display:none;">⏸️ Tạm Dừng</button>
                <button class="timer-btn reset" onclick="resetTimer()">🔄 Reset</button>
            </div>

            <div class="timer-laps" id="timerLaps"></div>
        </div>

        <!-- Alarm Tab -->
        <div id="alarmTab" class="tab-content">
            <div class="add-alarm">
                <input type="text" id="alarmName" placeholder="Tên báo thức..." />
                <input type="time" id="alarmTime" />
                <button onclick="addAlarm()">Thêm</button>
            </div>

            <ul id="alarmList" class="alarm-list"></ul>
        </div>
    </div>
